name = "beauty-flight-plan"
main = "workers/cloudflare.mjs"
compatibility_date = "2025-09-15"
compatibility_flags = ["nodejs_compat"]

# Static files are also readable by the Node handler from ./public
# Keep images/css/js next to the worker bundle via Rules below if needed.

[vars]
# Override after deploy, e.g. https://beauty-flight-plan.yourdomain.com
SITE_URL = "https://beauty-flight-plan.apps.grok.bot"

# Secrets (set via dashboard or CLI, do NOT commit values).
# Use BF_* names only — never reuse catering (Щастя Є) TELEGRAM_* secrets.
#   npx wrangler secret put BF_TELEGRAM_BOT_TOKEN
#   npx wrangler secret put BF_TELEGRAM_BOT_PASSWORD
#   npx wrangler secret put DATABASE_URL
# Optional:
#   npx wrangler secret put BF_TELEGRAM_CHAT_ID

# If you use Cloudflare Hyperdrive for Postgres, uncomment and set the id:
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "YOUR_HYPERDRIVE_ID"
